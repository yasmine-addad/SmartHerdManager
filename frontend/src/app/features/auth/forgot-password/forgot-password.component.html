<div class="page">

    <div class="card">

        <div class="icon-circle">
            📧
        </div>

        <h1>Mot de passe oublié</h1>

        <p class="subtitle">

            Entrez votre adresse e-mail.

            Nous vous enverrons un lien sécurisé afin de réinitialiser votre mot de passe.

        </p>

        <form
            [formGroup]="form"
            (ngSubmit)="sendEmail()">

            <div class="field">

                <label>

                    Adresse e-mail

                </label>

                <input
                    type="email"
                    formControlName="email"
                    placeholder="nom@email.com">

            </div>

            <button
                type="submit"
                [disabled]="loading">

                {{ loading ? 'Envoi...' : 'Envoyer le lien' }}

            </button>

        </form>

        <div
            class="success"
            *ngIf="success">

            ✅ Un e-mail de réinitialisation vient d'être envoyé.

        </div>

        <div
            class="error"
            *ngIf="error">

            {{ error }}

        </div>

        <a
            routerLink="/login"
            class="back">

            ← Retour à la connexion

        </a>

    </div>

</div>
